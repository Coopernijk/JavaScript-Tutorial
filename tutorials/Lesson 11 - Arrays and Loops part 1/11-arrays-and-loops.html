<!--

  in this lesson:
  1. Array = list of values
  2. Loops (while loop, for loop)
  3. Accumulator Pattern
  4. Created a Todo List
  5. Arrays are references, destructuring
  6. More features of loops:
     break, continue, loops inside a function
     
-->


<script>
  /* An Array is a type of values that contains a list of values */
  const myArray = [10, 20, 30]; 
  console.log(myArray)

  /* Display selected value from an array using '[]' brackets */
  console.log(myArray[0])

  /* change an object in array into another number */
  myArray[0] = 99
  console.log(myArray[0])

  /* Arrays can accept different types of values */
  const heY = [1, 'hello', true, {name: 'socks'}, [1, 2]]

  /* checking an array in console log will result in an object */
  console.log(typeof [1, 2])

  /* you can use this code instead to check an array */
  console.log(Array.isArray([1, 2]))

  /* since it also an object, it have its own methods and properties */
  console.log(myArray.length)

  /* adds a method to add a number at the end of an array */
  myArray.push(100)
  console.log(myArray.length)

  /* removes number of an array (startValue, endValue) */
  myArray.splice(0,1)
  console.log(myArray)




  /* Loop */
  /* 'while' keyword starts the loop, the brackets signals logical condition for loop to operate and will stop if it return false. inside, curly brackets run codes that can control the loop's conditional. either to continue or halt. */
  let i = 1;          // loop variable
  while (i <= 5) {    // loop condition
    console.log(i)    // loop body
    i = i + 1;
  }                   // this code will run 5 iteration (total number of work per loop)

  /* For Loop */
  /* simmilar to a simple Loop, For loop explicitly requires coder to state initial statement, condition in which if true will continue until its false (limit), and iteration, or method of repetition for the code body to run. */
  for (let x = '1'; x <= 5; x++) {
    console.log(x)
  }
  for (let i = 0, k = 0; (k++, i < 5); i++, k++) {
    console.log(i, k);
  }




  /* Array Loop */
  const todoList = [
    'make dinner',
    'wash dishes',
    'watch youtube'
  ]

  for (let index0 = 0; index0 <= todoList.length - 1; index0++) {
    console.log(todoList[index0])
  }




  /* Accumulator Pattern */
  /* create a variable to store the result, and loop through the array and update the result */
  const numArray = [1, 1, 3];
  let total = 0;

  for (let index1 = 0; index1 < numArray.length; index1++) {
    const num = numArray[index1];
    total += num;
  }
  console.log(total)



  const numDoubled = [];

  for (index1 = 0; index1 < numArray.length; index1++) {
    const num = numArray[index1];
    numDoubled.push(num * 2);
  };
  console.log(numDoubled);








/* In JavaScript:
   • A variable that holds a primitive stores the **value itself**.
   • A variable that holds an object (including arrays) stores a **reference** – like a label pointing to the object’s location in memory. */

/* General rule */ 
// Primitive → value stored directly
// Object/array → reference stored

/* Demonstration */
// array1 holds a reference to an array object
const array1 = [1, 2, 3];   
// array2 receives the same reference
const array2 = array1;      
// mutates the shared array
array2.push(4);             
// → [1, 2, 3, 4]
console.log(array1);        

let number1 = 1;            // number1 holds the primitive value 1
let number2 = number1;      // number2 gets a **copy** of that value
number2 = number2 + 2;      // number2 becomes 3, number1 remains 1
console.log(number1, number2); // → 1 3


/*in this code, i am using slice() method to **shallow copy** arrayx1 to arrayx2 so that any changes arrayx2 made will not mutate arrayx1 variable, preventing arrayx2 from getting assigned to the same pointer as arrayx1. this is similar (not the same) to how primitive value behave in which each variables contain its own value:*/
const arrayx1 = [1,2,3]
const arrayx2 = arrayx1.slice()
arrayx2.push(4)
console.log(arrayx1) //[1,2,3]
console.log(arrayx2) //[1,2,3,4]


/*de-structuring*/
/*
instead of writing a longer code to assign variable to specific array element in order like this:
  arrayx3 = [1,2,3]
  const firstValue = arrayx3[0]
  const secondValue = arrayx3[1]
you can use this code instead:
*/
  const [firstValue, secondValue] = [1,2,3]
  console.log(firstValue, secondValue)


/* customizing loop */
/*
loop provides options to control its behaviour other than simple conditionals. using *break* to halt the entire loop or *continue* to skip an iteration, the coder can control the expected output 
*/

for (let i=1; i<=10; i++) {
  if (i%3 === 0) {
    // skip any number divisible by 3
    continue
  }
  console.log(i)
  if (i === 8) {
    // end the loop
    break
  }
}


  /* 
  using while loop requires an exception on *continue* to resume loop's iteration and it needs to be manually stated  in the begining of a loop, otherwise, *continue* will result in an infinite loop.
  in this code we demonstrate an example where a conditional statement inside a *while* loop skip an iteration if a number is divisible by 3 using *continue*. *i++* was added before that to ensure the loop continues its iteration instead of re-evaluating the conditional over and over agin.
  the code was purposefuly written as redundant to illustrate the point in real-world scenarion
  */
function indivisibleByThree () {
  let i = 1

  while (i <= 10) {
    if (i%3 === 0) {
      i++
      continue
    }
    console.log(i)
    i++
  }
}

indivisibleByThree ();




  /*
  example using function's return, which will stop any operation in a function and return a value
  */

function doublingAgain(nums) {
  const numsDoubled = []
  for (let i=0; i<nums.length; i++) {
    const num = nums[i]
    if (num===0) {
      // either break or return<value> will stop the entire process
      break
    }
    numsDoubled.push(num*2)
  }
  return numsDoubled
}
console.log(doublingAgain([2, 2, 5, 0, 5]))
