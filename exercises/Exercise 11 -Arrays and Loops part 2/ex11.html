/*
  11o. Create an array of strings, loop over the array, and check if the string 'search' is inside the array. if it is, console.log() the index of 'search' in the array. If not, console.log'-1'.
  - ['hello', 'world', 'search', 'good'] => console.log(2)
  - ['not', 'found'] => console.log(-1)

  11p. Modify 11o so that if 'search' appears multiple times in the array, it will console.log() the index of the first appearance of 'search'. Use break;
  - ['hello', 'world', 'search', 'good', 'search'] => console.log(2)
*/

function findIndex (array, string) {
  let result = {name:`${string}`, index:0}
  for (let i=0; i<array.length; i++) {
    let check = array[i]
    if (check===string) {
      result.index = i
      break
    }
    else if (check!=string) {
      result.index = -1
    }
  }
  console.log(result.index)
  console.log(result)
}

function removeEgg (foods) {
  const result = []

    if (foods[i] === 'egg') {
      continue
    }

- console.log(foods) => ['egg', 'apple', 'egg', 'egg', 'ham']
*/

function removeEgg3 (foods) {

  const foodsCopy = foods.slice();
  let result = [];
  let counter = 0;

  for (i=0; i<foods.length; i++) {
    foodsCopy.reverse();
    if (foodsCopy[i]==='egg' && counter < 2) {
      counter++;
      continue;
    }
    result.push(foodsCopy[i]);
  }

  console.log(counter);
  console.log(`original array: ${foods}`);
  console.log(`array's copy: ${foodsCopy}`);
  console.log(`the result: ${result}`);
}

/*
Challenge Exercises

11v. We'll do the famous FizzBuzz proble. Create a loop that display 1 to 20 in the console. If the number is divisible by 3, display 'Fizz' instead of the number. if it's divisible by 5, display 'Buzz' instead. If it's divisible by 3 and 5, display 'FizzBuzz' instead. (Reminder: divisible by 3 means num %3 === 0).
- 1, 2, Fizz, 4, Buzz, Fizz, 7, 8, ... 13, 14, FizzBuzz, 16, 17, ...
*/

function fizzBuzz () {

  let array = [];

  for (i=1; i<20; i++) {
    if ((i%3)!=0 && (i%5!=0)) {
      array.push(i)
    }
    if ((i%3)===0 && (i%5===0) && !0) {
      array.push('FizzBuzz')
    }
    else if ((i%3)===0) {
      array.push('Fizz')
    }
    else if ((i%5===0)) {
      array.push('Buzz')
    }
    
  }

  console.log(array)

}

/*
11w. Create a copy of exercise 11q, where we created findIndex(). Below it, create a function unique(array) that takes an array of strings and returns an array where each string only appears once (there are no duplicates). Try to use the findIndex() function in your solution.
- unique(['green', 'red', 'blue', 'red']) => ['green', 'red', 'blue']
- unique(['red', 'green', 'green', 'red']) => ['red', 'green']
*/

function findIndex1(array, word) {
  for (let i = 0; i < array.length; i++) {
    if (array[i] === word) {
      return i;
    }
  }
  return -1;
}

function unique (array) {
  let resultCounter = []
  for (let i=0; i<array.length; i++) {
    const word = array[i]
    if (findIndex1(resultCounter, word)===-1) {
      resultCounter.push(word);
    }
    
  }
  console.log(resultCounter)
}
