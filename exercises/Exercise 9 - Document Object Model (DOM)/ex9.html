<!--
  9c. Create 2 buttons 'heads' and 'tails'. and a paragraph (<p></p>) underneath. when clicking the 'heads' button, display 'you choose: heads' in the paragraph. when the 'tails' button, display 'you choose: tails'.
-->
  <p>
    <button class="button-heads" onclick="keydown('heads')">heads</button>
    <button class="button-tails" onclick="keydown('tails')">tails</button>
    <p class="output-text0">_</p>
  </p>

  <script>
    
      const queryButton1 = document.querySelector('.button-heads')
      const textTemplate = 'you choose: '
      let queryResult = document.querySelector('.output-text0')

    function keydown(keyVariable) {
      if (keyVariable === 'heads') {
        queryResult.innerText = textTemplate + 'heads'
      } 
      else if (keyVariable === 'tails') {
        queryResult.innerText = textTemplate + 'tails'
      }
    }
    console.log()
  </script>






<!--
  9d. Create a text box (<input>) and submit button. When clicking 'Submit', display 'Your name is: ${text}' on the page (${text} = the text inside the text box) (hint: use.value to get the text inside an <input>).

  9e. Modify exercise 9d so that when you press 'Enter' in the <input>, it will also display the same message on the page (hint: use onkeydown and the event object).

  9f. Continuing from 9e, create a function to reuse the code (if you already did this, skip this exercise)
-->
  <p>
    <input class="input-box" type="text" placeholder="Enter your name" onkeydown="keyDown(event)">
    <button onclick="submitData()">Submit</button>
    <p class="output-text1">_</p>
  </p>

  <script>
    function submitData() {
      let inputBox = document.querySelector('.input-box').value
      document.querySelector('.output-text1').innerText = `Your name is: ${inputBox}`
    }

    function keyDown (event) {
      if (event.key === 'Enter') {
        submitData()
      }
    }
  </script>

<!--
  9i. We'll improve the Cart Quantity project.
      - Make a copy of exercise 7l (see the solution for 7l if needed).
      - Create a paragraph (<p></p>) to display the quantity.
      - Whenever we update the quantity, display it on the page instead of in the console. also, display the quantity when page first loads.
-->
  <p>
    <button onclick="
      updateCartQuantity(1);
    ">Add to Cart</button>

    <button onclick="
      updateCartQuantity(2);
    ">+2</button>

    <button onclick="
      updateCartQuantity(3);
    ">+3</button>

    <button onclick="
      updateCartQuantity(4);
    ">+4</button>

    <button onclick="
      updateCartQuantity(5);
    ">+5</button>

    <button onclick="
      updateCartQuantity(-1);
    ">Remove from cart</button>

    <button onclick="
      updateCartQuantity(-2);
    ">-2</button>

    <button onclick="
      updateCartQuantity(-3);
    ">-3</button>

    <button onclick="
      cartQuantity = 0;
      console.log('Cart was reset.');
      console.log(`Cart quantity: ${cartQuantity}`);
    ">Reset Cart</button>

    <output class="js-cartQ-output" style="background-color: white;"></output>
  </p>

  <script>
    let cartQuantity = 0;

    function cartQDefaultView () {
      document.querySelector('.js-cartQ-output').innerHTML = `Cart quantity: ${cartQuantity}`;
    }
    cartQDefaultView ();

    function updateCartQuantity(change) {
      if (cartQuantity + change > 10) {
        alert('The cart is full');
        return;
      }

      if (cartQuantity + change < 0) {
        alert('Not enough items in the cart');
        return;
      }

      cartQuantity += change;
      cartQDefaultView ();
    }
  </script>
