<!--
  10d. Create the button on the right. When clicking this button, it should turn ON/OFF. Hints:
  - When clicking the button, add or remove the class 'is-toggled', and use it to change the styling.
  - use of (classList.contains('is-toggled')) to decide whether to add or remmove the 'is-toggled' class.

  10e. Continuing from 10d, create 3 buttons that can be turned ON / OFF.

  10f. Continuing from 10e, use a function to reuse the code, and separate each language into its own file (if you didn't do this already).
-->
<div>
  <button class="x10d-toggle x10d-button1" onclick="hobbyToggle('.x10d-button1')">Gaming</button>
  <button class="x10d-toggle x10d-button2" onclick="hobbyToggle('.x10d-button2')">Music</button>
  <button class="x10d-toggle x10d-button3" onclick="hobbyToggle('.x10d-button3')">Tech</button>
</div>

<script>
  function hobbyToggle(element) {
    let hobby =  document.querySelector(element);

    if (hobby.classList.contains('x10d-toggled') === false) {
      hobby.classList.add('x10d-toggled')
    } else {
      hobby.classList.remove('x10d-toggled')
    }
  }
</script>

<script>
  function turnItOn (param) {
    const buttonOn = document.querySelector(param);
    if (!buttonOn.classList.contains('x10d-toggled')) {
      turnOffOtherButtons ();
      buttonOn.classList.add('x10d-toggled');
    } else {
      buttonOn.classList.remove('x10d-toggled');
    }
  }
  function turnOffOtherButtons () {
    const prevButton = document.querySelector('.x10d-toggled');
    if (prevButton) {
      prevButton.classList.remove('x10d-toggled');
    }
  }
</script>

<div>
  <p>Amazon Shipping Calculator</p>
  <input placeholder="Cost of order" class="js-cost-input cost-input" onkeydown="
    handleCostKeydown(event);
  ">
  <button onclick="
    calculateTotal();
  " class="calculate-button">Calculate</button>
  <p class="js-total-cost"></p>
</div>

<script>
  String(25)
  console.log('25' - 5);
  console.log('25' + 5);

  window.document
  window.console.log('window');
  window.alert

  function handleCostKeydown(event) {
    if (event.key === 'Enter') {
      calculateTotal();
    }
  }

  function calculateTotal() {
    const inputElement = document.querySelector('.js-cost-input');
    let cost = Number(inputElement.value);

    if (cost < 40 && cost > 0) {
      cost = cost + 10;
      document.querySelector('.js-total-cost').innerHTML = `$${cost}`;
    } else if (cost <= 0) {
      document.querySelector('.js-total-cost').innerHTML = `Error: cost cannot be less or equal to $0`;
    } else if (cost >= 40) {
      cost = cost;
      document.querySelector('.js-total-cost').innerHTML = `$${cost}`;
    }
  }
</script>
